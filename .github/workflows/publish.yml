name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # As in the npm trusted-publishing example (docs.npmjs.com/trusted-publishers). Removing
          # it (2.12.1 first OIDC attempt) ended in ENEEDAUTH: the OIDC exchange did not happen.
          registry-url: https://registry.npmjs.org
          # Release job: no dependency cache (cache poisoning, zizmor). setup-node >= v5
          # caches automatically when package.json declares npm as packageManager.
          package-manager-cache: false
      - name: Verify no tarball contamination
        run: |
          # Guard 1: package/ directory must not exist (npm pack residue overwrites package.json in tarball)
          if [ -d "package" ]; then
            echo "::error::package/ directory found — this overwrites package.json in the published tarball. Remove it."
            exit 1
          fi
          # Guard 2: no typosquat candidates in dependencies — uses muaddib's own
          # typosquat detector (findTyposquatMatch) against ~100 popular packages.
          # Catches loadash/chlk/expresss/requestt/etc, not just hardcoded names.
          node scripts/check-deps-typosquats.js
          # Guard 3: npm overrides - documented, plain registry versions only (no alias /
          # URL / git / file redirection), locked. --security-only: the "no longer needed"
          # housekeeping check runs in the PR test job and never blocks a release.
          node scripts/check-overrides.js --security-only
      - run: npm ci
      - name: Verify dep provenance attestations (SLSA gate)
        run: npm audit signatures
      - name: Verify no HIGH/CRITICAL CVE in dependencies (F2 — defense-in-depth at release)
        # Same gate as the PR CI. Release path, so fail-closed on a sustained outage is even
        # more justified. Passes today (lone vuln is moderate, below the threshold).
        timeout-minutes: 5
        run: npm audit --audit-level=high
      - run: npm test
      - name: Validate tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
      - name: Self-scan node_modules (forensic record, non-blocking)
        env:
          REF_NAME: ${{ github.ref_name }}
        # Written outside the package root: up to 2.12.0 this file was published inside the tarball.
        run: node bin/muaddib.js scan node_modules --json > "${RUNNER_TEMP}/self-scan-${REF_NAME}.json" || true
      - name: Verify package contents (allowlist)
        # The published tarball may only hold runtime files (same check as the PR product-smoke job).
        run: node scripts/check-package-contents.js
      - name: Verify npm supports trusted publishing (>= 11.5.1)
        run: |
          V=$(npm --version)
          echo "npm $V"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a*1e6+b*1e3+c < 11005001) { console.error("::error::npm " + process.argv[1] + " < 11.5.1: OIDC trusted publishing unsupported"); process.exit(1); }' "$V"
      # Trusted publishing (OIDC, id-token: write above): no NPM_TOKEN. The npm package settings
      # must list this repository and this workflow file as trusted publisher.
      # npm logs a failed OIDC exchange only at verbose level, then continues unauthenticated
      # (ENEEDAUTH): verbose keeps the real reason in the job log.
      - run: npm publish --provenance --access public --loglevel verbose
      - name: Verify the version is live on the registry
        # npm can accept an upload and still not publish it (2026-11-14: "+ muaddib-scanner@2.12.1"
        # then 404 for 10+ minutes with an expired token). A release is done only when the
        # registry serves it.
        timeout-minutes: 15
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 60); do
            if [ "$(npm view "muaddib-scanner@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "muaddib-scanner@$VERSION is live"; exit 0
            fi
            sleep 15
          done
          echo "::error::muaddib-scanner@$VERSION is not served by the registry 15 min after publish"
          exit 1

  # A release is done only when the version a user installs from npm DETECTS a known-malicious
  # dependency from an empty HOME. 2.10.45 to 2.12.2 shipped with no IOC data reachable (first-run
  # download 404): a flatmap-stream@0.1.1 dependency scored 0, and no check noticed.
  product-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the published version like a user
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p "${RUNNER_TEMP}/inst"
          cd "${RUNNER_TEMP}/inst"
          npm init -y >/dev/null
          npm install "muaddib-scanner@${VERSION}" --ignore-scripts --no-audit --no-fund
      - name: Scan a known-malicious dependency with an empty HOME (must detect)
        run: node scripts/product-smoke.js "${RUNNER_TEMP}/inst/node_modules/muaddib-scanner/bin/muaddib.js" --expect detect
