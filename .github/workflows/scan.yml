name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@54045abd5dcd3b0fee9ca02fa24c57545834c9cc # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Guard - no typosquat in package.json deps
        run: node scripts/check-deps-typosquats.js
      - name: Guard - node_modules not tracked in git
        run: node scripts/check-no-tracked-node-modules.js
      - name: Guard - no HIGH/CRITICAL CVE in dependencies (synchronous CVE gate, F2)
        # Fails the PR on HIGH/CRITICAL advisories (passes today: lone vuln is moderate).
        # npm's built-in fetch-retries=2 (10-60s backoff) absorbs transient endpoint blips;
        # timeout-minutes bounds a sustained outage to a fast fail-closed block (better to
        # block than merge un-audited). Normal audit runs in seconds, so 5 min is ample.
        timeout-minutes: 5
        run: npm audit --audit-level=high
      - name: Guard - doc counts in sync with source (stats markers)
        run: npm run docs:stats:check
      - name: Run tests
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@54045abd5dcd3b0fee9ca02fa24c57545834c9cc # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g c8@11.0.0
      - name: Run tests with coverage
        run: c8 --reporter=lcov --reporter=text npm test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@54045abd5dcd3b0fee9ca02fa24c57545834c9cc # v4
        with:
          node-version: '24'
      - run: npm ci
      - name: MUAD'DIB self-scan
        run: node bin/muaddib.js scan . --sarif results.sarif --fail-on none --exclude tests --exclude docker --exclude node_modules --exclude deploy --exclude datasets --exclude src/scanner --exclude src/ioc --exclude vscode-extension
      - name: Filter SARIF (exclude scanner source — self-referential findings)
        run: node .github/filter-sarif.js results.sarif
      - name: Fail on CRITICAL (post-filter)
        run: node -e "const s=JSON.parse(require('fs').readFileSync('results.sarif','utf8'));const c=(s.runs[0].results||[]).filter(r=>r.level==='error');if(c.length){c.forEach(r=>console.error(r.ruleId+' in '+(r.locations?.[0]?.physicalLocation?.artifactLocation?.uri||'?')));process.exit(1)}console.log('No CRITICAL findings after filter')"
      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: results.sarif
