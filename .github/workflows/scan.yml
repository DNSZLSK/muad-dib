name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Guard - no typosquat in package.json deps
        run: node scripts/check-deps-typosquats.js
      - name: Guard - npm overrides documented, plain registry versions, still needed
        run: node scripts/check-overrides.js
      - name: Guard - node_modules not tracked in git
        run: node scripts/check-no-tracked-node-modules.js
      - name: Guard - no HIGH/CRITICAL CVE in dependencies (synchronous CVE gate, F2)
        # Fails the PR on HIGH/CRITICAL advisories (passes today: lone vuln is moderate).
        # npm's built-in fetch-retries=2 (10-60s backoff) absorbs transient endpoint blips;
        # timeout-minutes bounds a sustained outage to a fast fail-closed block (better to
        # block than merge un-audited). Normal audit runs in seconds, so 5 min is ample.
        timeout-minutes: 5
        run: npm audit --audit-level=high
      - name: Guard - doc counts in sync with source (stats markers)
        run: npm run docs:stats:check
      - name: Lint (0 errors, warning count may only go down)
        run: npm run lint
      - name: Run tests
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run tests with coverage (floors in .c8rc.json)
        # c8 comes from the lockfile (devDependency), not an unpinned global install.
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Fuzz, fixed seed (blocking, reproducible)
        run: npm run test:fuzz
      - name: Fuzz, per-run seed (exploratory, non-blocking; replay with MUADDIB_FUZZ_SEED)
        continue-on-error: true
        env:
          MUADDIB_FUZZ_SEED: ${{ github.run_id }}
        run: npm run test:fuzz

  # The product AS A USER INSTALLS IT: npm pack of this checkout, installed in a temp dir, then a
  # known-malicious dependency scanned with an empty HOME. The npm package ships no IOC data;
  # for months the first-run download was a 404 and such a scan scored 0, unnoticed (2026-11-14).
  # The packed checkout must DETECT it, through the signed ioc-db release.
  product-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Package contents (runtime files only)
        run: node scripts/check-package-contents.js
      - name: Pack and install like a user
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pack" "${RUNNER_TEMP}/inst"
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/pack"
          cd "${RUNNER_TEMP}/inst"
          npm init -y >/dev/null
          npm install "${RUNNER_TEMP}"/pack/*.tgz --ignore-scripts --no-audit --no-fund
      - name: Scan a known-malicious dependency with an empty HOME
        run: node scripts/product-smoke.js "${RUNNER_TEMP}/inst/node_modules/muaddib-scanner/bin/muaddib.js" --expect detect

  # Calibration phase: non-blocking until the budgets in tests/benchmark-budgets.json are set
  # from the measurements of this runner (artifact benchmark-results), then blocking.
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Benchmark against budgets (small, medium, large; 3 iterations)
        run: node --expose-gc tests/benchmark.js --budget tests/benchmark-budgets.json --iterations 3 --json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: metrics/benchmark-*.json
          if-no-files-found: warn

  scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - name: MUAD'DIB self-scan
        run: node bin/muaddib.js scan . --sarif results.sarif --fail-on none --exclude tests --exclude docker --exclude node_modules --exclude deploy --exclude datasets --exclude src/scanner --exclude src/ioc --exclude vscode-extension
      - name: Filter SARIF (exclude scanner source — self-referential findings)
        run: node .github/filter-sarif.js results.sarif
      - name: Fail on CRITICAL (post-filter)
        run: node -e "const s=JSON.parse(require('fs').readFileSync('results.sarif','utf8'));const c=(s.runs[0].results||[]).filter(r=>r.level==='error');if(c.length){c.forEach(r=>console.error(r.ruleId+' in '+(r.locations?.[0]?.physicalLocation?.artifactLocation?.uri||'?')));process.exit(1)}console.log('No CRITICAL findings after filter')"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
