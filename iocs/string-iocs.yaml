  # ── Mini Shai-Hulud / SAP CAP campaign (TeamPCP, 2026-04-29) ──
  # Sources cross-confirmed:
  #   https://www.wiz.io/blog/mini-shai-hulud-supply-chain-sap-npm
  #   https://kudelskisecurity.com/research/mini-shai-hulud-supply-chain-attack
  #   https://www.darkreading.com/cloud-security/teampcp-sap-packages-mini-shai-hulud
  #   https://snyk.io/blog/bun-based-stealer-hits-sap-cap-js-mbt-npm-packages/
  # Affected packages : @cap-js/sqlite@2.2.2, @cap-js/postgres@2.2.2,
  # @cap-js/db-service@2.10.1, mbt@1.2.48, intercom-client@7.0.4-7.0.5,
  # lightning (PyPI) 2.6.2-2.6.3.
  # Pattern : preinstall hook → setup.mjs → download Bun runtime →
  # execute ~11.6 MB obfuscated credential stealer → exfil via attacker
  # GitHub repos. Self-propagation via stolen tokens (worm characteristic).
  - string: "OhNoWhatsGoingOnWithGitHub"
    campaign: "mini-shai-hulud-2026-04"
    severity: CRITICAL
    source: "https://www.wiz.io/blog/mini-shai-hulud-supply-chain-sap-npm"
    description: "Commit message signature used by Mini Shai-Hulud for fallback exfil to attacker GitHub repos"
