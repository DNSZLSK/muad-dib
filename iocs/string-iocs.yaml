  # ── NullReceiver (DPRK "Contagious Interview" / XORIndex loader, 2026-07..08) ──
  # Sources: thehackernews.com/2026/08/trojanized-npm-packages-decode-c2-ip.html
  #          sonatype.com/blog/six-npm-packages-use-ethereum-transactions-to-retrieve-malicious-payloads
  # Blockchain-C2 evolution of EtherHiding: the loader reads a hard-coded attacker
  # wallet's most recent outbound tx and decodes the C2 IPv4 out of the recipient
  # address bytes (zero-value / zero-data transfer = no smart contract, no calldata
  # signal), then fetches+runs BeaverTail. The wallet is the ONE artifact that lives
  # in the package source itself — the C2 IP (166.88.134.62) and the dead-drop
  # recipient (0xa658863ea658863e68656c6c6f6970626f742121 → "helloipbot!!") resolve
  # on-chain at runtime, so they stay as network/intel markers (iocs-compact) rather
  # than source string-IOCs. Package names are covered by the npm IOC base (wildcards
  # + versioned for the hijacked @kolbo/mcp, agentgui, godot-kit).
  - string: "0xa322e5f3d311d3080e6f0121063e9adc2490ef1a"
    campaign: "nullreceiver-2026-08"
    severity: CRITICAL
    source: "https://thehackernews.com/2026/08/trojanized-npm-packages-decode-c2-ip.html"
    description: "Hard-coded attacker Ethereum wallet whose latest outbound tx encodes the C2 IP in its recipient address (NullReceiver blockchain-C2 dead-drop resolver)"

  # ── PolinRider case study (DiogoAngelim / fetch-page-assets, 2026-08) ──
  # Source: opensourcemalware.com/blog/polinrider-npm-case-study-dprk-attack
  # DPRK farms compromised legitimate maintainers and reproduces the NullReceiver
  # loader in every new release (fetch-page-assets v1.2.9..1.2.14, html-to-gutenberg).
  # The loader tags every build with a campaign marker assigned to a global var:
  #   global.i="A8-3292-1"  (babel.config.cjs, v1.2.12)
  #   global.i="A8-3292-2"  (babel.config.cjs, v1.2.13/1.2.14)
  #   global.i="A8-*#"      (fake-font .woff2 variant, all releases)
  # The anchored prefix `global.i="A8-` catches all three variants and is decisive:
  # a global var named `i` assigned a string starting "A8-" has no benign meaning.
  # This fires on the config-file injection point (babel.config.cjs is a .cjs → in
  # SCAN_EXTENSIONS); the .woff2 body is covered structurally by BINSRC-002 instead
  # (ioc-strings does not read font extensions). The wallet/RPC/C2-IP are NOT added
  # here: the public Ethereum RPC endpoints (1rpc.io, eth.drpc.org, publicnode.com,
  # blastapi.io, blockscout.com) are legitimate dApp infrastructure — a substring
  # match would false-positive on any benign web3 package (fails inclusion criterion #4).
  - string: 'global.i="A8-'
    campaign: "polinrider-2026-08"
    severity: CRITICAL
    source: "https://opensourcemalware.com/blog/polinrider-npm-case-study-dprk-attack"
    description: "PolinRider/NullReceiver loader campaign marker (global.i=\"A8-...\") injected into config files (babel.config.cjs) and fake .woff2 fonts across every release of a compromised maintainer's packages"
