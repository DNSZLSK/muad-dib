version: "1.0.0"
updated: "2026-05-01"
# String IOCs (YARA-style) — high-precision unique malware artifacts.
# Each entry is a literal string searched in source files (.js, .cjs, .mjs,
# .ts, .tsx, .py). Match in any source file fires the rule with score 100.
#
# Inclusion criteria (any string promoted here MUST satisfy):
#   1. length >= 6 chars
#   2. confirmed presence in >= 1 sample malware (link in `source`)
#   3. absent from the curated benign corpus (532 npm packages)
#   4. unique enough that a substring match is decisive (no common english
#      words, no library-style names, no version numbers)
#
# Format:
#   - string: <literal substring>
#     campaign: <stable identifier, kebab-case, year-month suffix recommended>
#     severity: CRITICAL | HIGH
#     source: <URL to the writeup / RE / advisory that documented it>
#     description: <one-sentence what this string is in the malware>

